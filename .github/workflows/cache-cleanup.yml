name: Cache Cleanup

on:
  schedule:
    # Run daily at 04:00 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Cleanup old caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Fetching list of caches..."

          # We use jq to filter caches where the createdAt timestamp is less than 7 days ago
          # Calculate 7 days ago timestamp in jq using now function
          echo "Finding caches older than 7 days..."

          # list caches and delete them if they are older than 7 days
          gh cache list --limit 100 --json id,createdAt --jq '.[] | select((.createdAt | fromdate) < (now - 7*86400)) | .id' | xargs -r -I {} bash -c 'echo "Deleting cache ID: {}"; gh cache delete "{}" || true'

          echo "Cache cleanup completed."
